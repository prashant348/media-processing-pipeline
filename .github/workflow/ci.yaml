name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Docker is already available on ubuntu-latest,
      # so Testcontainers will work out of the box!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: lastest

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -o main ./

